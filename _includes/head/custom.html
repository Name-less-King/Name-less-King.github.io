{% include base_path %}

<!-- start custom head snippets -->

<!-- Site favicon -->
<link rel="icon" href="{{ base_path }}/favicon.ico?v=4" sizes="any">
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/favicon-32x32.png?v=4">
<link rel="icon" type="image/png" sizes="16x16" href="{{ base_path }}/images/favicon-16x16.png?v=4">
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v=4">
<link rel="manifest" href="{{ base_path }}/images/manifest.json?v=4">
<meta name="theme-color" content="#a7a8b2">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

{% if page.mathjax %}
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      processEscapes: true,
      tags: 'all'
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}

<!-- end custom head snippets -->
