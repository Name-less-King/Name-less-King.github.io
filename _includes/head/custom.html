{% include base_path %}

<!-- start custom head snippets -->

<!-- Site favicon -->
<link rel="shortcut icon" type="image/x-icon" href="{{ base_path }}/images/site-icon-g.ico">
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/site-icon-g.svg">
<link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/site-icon-g-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="{{ base_path }}/images/site-icon-g-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/site-icon-g-180x180.png">
<link rel="manifest" href="{{ base_path }}/images/site.webmanifest">
<meta name="theme-color" content="#a7a8b2">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

{% if page.mathjax %}
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      processEscapes: true,
      tags: 'all'
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}

<!-- end custom head snippets -->
